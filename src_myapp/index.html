<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>サンプル</title>
  <link rel="stylesheet" href="resource/css/styles_index.css">
</head>

<body>
  <div class="container">

    <div class="form-row">
      <label class="label">分類：</label>

      <label class="radio-label">
        <input type="radio" name="category" value="kanji" checked>
        漢字
      </label>

      <label class="radio-label">
        <input type="radio" name="category" value="word">
        単語
      </label>
    </div>

    <div class="form-row">
      <label class="label" for="inputText">漢字/単語：</label>
      <input type="text" id="inputText">
    </div>

    <div class="form-row">
      <label class="label" for="reading">読み：</label>
      <input type="text" id="reading">
    </div>

    <div class="form-row">
      <label class="label" for="meaning">意味：</label>
      <input type="text" id="meaning">
    </div>

    <div class="button-area">
      <button type="button" onclick="clearForm()">クリア</button>
      <button type="button" onclick="send()">登録</button>
    </div>

  </div>

  <div id="confirmDialog" class="modal hidden">
    <div class="modal-backdrop" onclick="closeConfirmDialog()"></div>
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle">登録内容の確認</h2>
      <div class="confirm-row">
        <span class="confirm-label">分類：</span>
        <span id="confirmCategory"></span>
      </div>
      <div class="confirm-row">
        <span class="confirm-label">漢字/単語：</span>
        <span id="confirmText"></span>
      </div>
      <div class="confirm-row">
        <span class="confirm-label">読み：</span>
        <span id="confirmReading"></span>
      </div>
      <div class="confirm-row">
        <span class="confirm-label">意味：</span>
        <span id="confirmMeaning"></span>
      </div>
      <div class="confirm-button-area">
        <button type="button" onclick="closeConfirmDialog()">キャンセル</button>
        <button type="button" onclick="executeAction()">実行</button>
      </div>
    </div>
  </div>

  <script src="resource/js/script.js"></script>
</body>
</html>
